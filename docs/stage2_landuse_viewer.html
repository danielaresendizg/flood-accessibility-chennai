<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage 2 — Risk Data</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; background:#000;
      font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:#fff; }

    #app { display:flex; height:100%; }

    /* ── Left: all bars ── */
    #left {
      flex:1; height:100%; overflow:hidden;
      padding:clamp(16px,2.5vh,28px) 32px clamp(16px,2.5vh,28px) 28px;
      display:flex; flex-direction:column;
      justify-content:space-between;
    }

    .group-title {
      font-size:9px; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:#fff;
      margin-bottom:10px;
      flex-shrink:0;
    }
    .bars-group {
      display:flex; flex-direction:column;
      justify-content:space-around;
      gap:0;
      flex:1;
    }

    .bar-row { display:flex; flex-direction:column; gap:4px; }
    .bar-label-row {
      display:flex; justify-content:space-between; align-items:center;
    }
    .bar-name { display:flex; align-items:center; gap:6px; font-size:9px;
      text-transform:uppercase; letter-spacing:.06em; color:#fff; }
    .bar-dot { width:7px; height:7px; border-radius:1px; flex-shrink:0; }
    .bar-meta { color:#aaa; font-weight:400; font-size:8px; margin-left:2px; }
    .bar-high-pct { font-weight:700; font-size:8px; color:#0000FF; }
    .stack-track { height:7px; display:flex; border-radius:1px; overflow:hidden; }
    .stack-seg { height:100%; transition:width 400ms ease; }
    .seg-null     { background:rgba(255,255,255,0.07); }
    .seg-low      { background:rgba(100,149,237,0.38); }
    .seg-moderate { background:rgba(65,105,225,0.62); }
    .seg-high     { background:#0000FF; }

    .group-divider {
      border:none; border-top:1px solid #1a1a1a;
      margin:clamp(8px,1.5vh,20px) 0;
      flex-shrink:0;
    }

    /* ── Right: controls + context ── */
    #right {
      width:340px; flex-shrink:0; height:100%;
      border-left:1px solid #1a1a1a;
      display:flex; flex-direction:column;
      padding:clamp(16px,2.5vh,28px) 24px;
      gap:clamp(12px,2vh,24px);
      overflow:hidden;
    }

    .ctrl-label {
      font-size:9px; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:#fff; margin-bottom:10px; flex-shrink:0;
    }
    .filter-row { display:flex; flex-wrap:wrap; gap:5px; }
    .fbtn {
      padding:4px 10px; background:transparent; border:1px solid #222;
      border-radius:2px; font-size:8px; font-weight:400; text-transform:uppercase;
      letter-spacing:.06em; cursor:pointer; color:#aaa; transition:all 100ms;
    }
    .fbtn.active { background:#0000FF; border-color:#0000FF; color:#fff; }

    /* Mini-map */
    #minimap {
      width:100%; flex:1; min-height:0;
      margin-top:4px;
    }
    #minimap svg { width:100%; height:100%; }
    .mm-frag { fill:transparent; stroke:#333; stroke-width:1.5; cursor:pointer; transition:fill 200ms,stroke 200ms; }
    .mm-frag.active { fill:rgba(0,0,255,0.35); stroke:#0000FF; stroke-width:2; }
    .mm-frag:hover  { fill:rgba(0,0,255,0.15); stroke:#555; }

    /* Narrative */
    #narrative { display:flex; flex-direction:column; gap:6px; }
    #narrative-tag {
      font-size:9px; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:#0000FF; margin-bottom:6px;
    }
    #narrative-text { font-size:11px; color:#aaa; line-height:1.7; }

    /* Legend */
    #legend { display:flex; flex-direction:column; gap:6px; margin-top:auto; padding-top:16px; }
    .leg-item { display:flex; align-items:center; gap:7px; font-size:8px; color:#fff; }
    .leg-swatch { width:20px; height:8px; border-radius:1px; flex-shrink:0; }
  
    /* Orientation lock — portrait mobile/tablet */
    #rotate-prompt {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.96);
      color: #fff;
      text-align: center;
      touch-action: none;
    }
    #rotate-prompt .rp-card {
      max-width: 380px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 28px 24px;
      background: rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #rotate-prompt .rp-icon {
      width: 52px; height: 52px;
      animation: rp-spin 2s ease-in-out infinite;
      opacity: .75;
    }
    @keyframes rp-spin {
      0%   { transform: rotate(0deg); }
      40%  { transform: rotate(90deg); }
      60%  { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
    #rotate-prompt .rp-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }
    #rotate-prompt .rp-sub {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
    }
    @media (max-width: 1024px) and (orientation: portrait) {
      #rotate-prompt { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-prompt" aria-live="polite">
    <div class="rp-card">
      <svg class="rp-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2"/>
        <path d="M12 18h.01"/>
      </svg>
      <div class="rp-title">Rotate your device</div>
      <div class="rp-sub">This atlas is designed to be viewed in landscape mode for the best experience.</div>
    </div>
  </div>

<div id="app">

  <!-- Left: all bars -->
  <div id="left">
    <div class="group-title">Urban services exposure</div>
    <div class="bars-group" id="chart-services"></div>

    <hr class="group-divider">

    <div class="group-title">Land use flood risk exposure</div>
    <div class="bars-group" id="chart-landuse"></div>
  </div>

  <!-- Right: controls + context -->
  <div id="right">
    <div>
      <div class="ctrl-label">Fragment</div>
      <div class="filter-row" id="frag-filter">
        <button class="fbtn active" data-frag="all">All</button>
        <button class="fbtn" data-frag="F1">F1</button>
        <button class="fbtn" data-frag="F2">F2</button>
        <button class="fbtn" data-frag="F3">F3</button>
        <button class="fbtn" data-frag="F4">F4</button>
        <button class="fbtn" data-frag="F5">F5</button>
      </div>
      <div id="minimap"></div>
    </div>

    <div id="narrative">
      <div id="narrative-tag">All fragments</div>
      <div id="narrative-text">Select a fragment to see its specific risk profile.</div>
    </div>

    <div id="legend">
      <div class="ctrl-label">Risk level</div>
      <div class="leg-item"><div class="leg-swatch seg-null"></div>No risk</div>
      <div class="leg-item"><div class="leg-swatch seg-low"></div>Low</div>
      <div class="leg-item"><div class="leg-swatch seg-moderate"></div>Moderate</div>
      <div class="leg-item"><div class="leg-swatch seg-high"></div>High</div>
    </div>
  </div>

</div>
<script>
const FRAGS = ["F1","F2","F3","F4","F5"];
const SVCS  = ["Health","Education","Slums","Shelters"];
const SVC_COLORS = { Health:"#ef4444", Education:"#f59e0b", Slums:"#8b5cf6", Shelters:"#3b82f6" };
const SVC_ICONS = {
  Health:    `<svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="12" height="12" rx="1"/><line x1="7" y1="4" x2="7" y2="10"/><line x1="4" y1="7" x2="10" y2="7"/></svg>`,
  Education: `<svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="7,2 13,5.5 7,9 1,5.5"/><path d="M4 7.5v3c0 0 1.5 1.5 3 1.5s3-1.5 3-1.5v-3"/><line x1="13" y1="5.5" x2="13" y2="9"/></svg>`,
  Slums:     `<svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,8 4,4 7,6 10,3 13,6"/><polyline points="1,8 1,13 13,13 13,6"/><line x1="5.5" y1="13" x2="5.5" y2="10"/><line x1="8.5" y1="13" x2="8.5" y2="10"/></svg>`,
  Shelters:  `<svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,7 7,2 13,7"/><polyline points="3,6 3,12 11,12 11,6"/><rect x="5.5" y="9" width="3" height="3"/></svg>`,
};
const USE_ORDER  = ["residential","mix_residential","commercial","industrial","institutional","open_space","agricultural","waterbody"];
const USE_LABELS = { residential:"Residential", mix_residential:"Mix residential", commercial:"Commercial",
                     industrial:"Industrial", institutional:"Institutional", open_space:"Open space",
                     agricultural:"Agricultural", waterbody:"Waterbody" };
const USE_COLORS = { residential:"#FFFF82", mix_residential:"#FFD700", commercial:"#FF4040",
                     industrial:"#9B59B6",  institutional:"#4A90D9",   open_space:"#7DC67E",
                     agricultural:"#C8E6A0", waterbody:"#A8D8EA" };

const NARRATIVES = {
  all: "Across all 5 fragments, <strong>Education and Health</strong> show the highest share of units in high-risk zones. Residential land use dominates the city's flood-exposed area.",
  F1:  "Fragment F1 has a <strong>high proportion of shelters with no flood classification</strong> — 83% are unclassified, suggesting infrastructure gaps in risk mapping.",
  F2:  "Fragment F2 has the <strong>largest number of informal settlements</strong>, with 35 in low-risk zones but significant concentrations across all levels.",
  F3:  "Fragment F3 is the <strong>most intensely exposed</strong>: industrial and institutional land uses show over 56–78% of their area in high-risk zones.",
  F4:  "Fragment F4 is the <strong>most vulnerable pocket</strong> — it concentrates the highest counts of high-risk health units, schools, slums, and shelters across all fragments.",
  F5:  "Fragment F5 shows <strong>moderate overall exposure</strong>, with open space having the highest % in high-risk zones (41%), suggesting encroachment on natural drainage.",
};

let SVC_DATA = {};
let LU_DATA  = [];

function buildChart(containerId, rows) {
  document.getElementById(containerId).innerHTML = rows.map(({ name, color, icon, meta, d }) => {
    const total = d.null + d.low + d.mod + d.high;
    if (total === 0) return '';
    const highPct = (d.high / total * 100).toFixed(0);
    const w = v => (v / total * 100).toFixed(1);
    const indicator = icon
      ? `<span style="color:#fff;display:flex;align-items:center;">${icon}</span>`
      : `<span class="bar-dot" style="background:${color}"></span>`;
    return `
      <div class="bar-row">
        <div class="bar-label-row">
          <span class="bar-name">
            ${indicator}
            ${name}<span class="bar-meta">${meta}</span>
          </span>
          <span class="bar-high-pct">${highPct}% high</span>
        </div>
        <div class="stack-track">
          <div class="stack-seg seg-null"     style="width:${w(d.null)}%"></div>
          <div class="stack-seg seg-low"      style="width:${w(d.low)}%"></div>
          <div class="stack-seg seg-moderate" style="width:${w(d.mod)}%"></div>
          <div class="stack-seg seg-high"     style="width:${w(d.high)}%"></div>
        </div>
      </div>`;
  }).join("");
}

function updateCharts(frag) {
  const frags = frag === 'all' ? FRAGS : [frag];

  document.getElementById('narrative-tag').textContent = frag === 'all' ? 'All fragments' : `Fragment ${frag}`;
  document.getElementById('narrative-text').innerHTML  = NARRATIVES[frag] || '';

  // Services
  buildChart("chart-services", SVCS.map(svc => {
    const d = { null:0, low:0, mod:0, high:0 };
    frags.forEach(f => { const s = SVC_DATA[svc]?.[f]; if (s) { d.null+=s.null; d.low+=s.low; d.mod+=s.mod; d.high+=s.high; } });
    return { name:svc, color:SVC_COLORS[svc], icon:SVC_ICONS[svc], meta:` · ${d.null+d.low+d.mod+d.high} units`, d };
  }));

  // Land use
  const lvKey = l => l==='00_null'?'null': l==='01_high'?'high': l==='02_moderate'?'mod':'low';
  const totals = {};
  USE_ORDER.forEach(use => { totals[use] = { null:0, low:0, mod:0, high:0 }; });
  LU_DATA.filter(d => frag==='all' || d.frag===frag).forEach(({ use, level, area }) => {
    if (totals[use]) totals[use][lvKey(level)] += area;
  });
  buildChart("chart-landuse", USE_ORDER.map(use => {
    const d = totals[use];
    const total = d.null + d.low + d.mod + d.high;
    return { name:USE_LABELS[use], color:USE_COLORS[use], meta:` · ${(total/1e6).toFixed(1)} km²`, d };
  }));

  document.querySelectorAll('.mm-frag').forEach(el =>
    el.classList.toggle('active', frag !== 'all' && el.dataset.frag === frag)
  );
}

async function buildMinimap() {
  const data = await (await fetch('./data/fragments.geojson')).json();
  const allCoords = [];
  data.features.forEach(f => {
    const rings = f.geometry.type === 'Polygon' ? f.geometry.coordinates : f.geometry.coordinates.flat();
    rings.forEach(r => r.forEach(c => allCoords.push(c)));
  });
  const minX = Math.min(...allCoords.map(c=>c[0])), maxX = Math.max(...allCoords.map(c=>c[0]));
  const minY = Math.min(...allCoords.map(c=>c[1])), maxY = Math.max(...allCoords.map(c=>c[1]));
  const W = 232, H = 270;
  const scale = Math.min(W/(maxX-minX), H/(maxY-minY)) * 0.92;
  const offX = (W-(maxX-minX)*scale)/2, offY = (H-(maxY-minY)*scale)/2;
  const proj = c => [(c[0]-minX)*scale+offX, H-((c[1]-minY)*scale+offY)];
  const ringD = r => r.map((c,i)=>{ const [x,y]=proj(c); return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`; }).join(' ')+' Z';

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  data.features.forEach(f => {
    const id = `F${f.properties.id}`;
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    const rings = f.geometry.type==='Polygon' ? f.geometry.coordinates : f.geometry.coordinates.flat(1);
    path.setAttribute("d", rings.map(ringD).join(' '));
    path.setAttribute("class","mm-frag");
    path.dataset.frag = id;
    path.addEventListener('click', () => {
      document.querySelectorAll('[data-frag]').forEach(b => b.classList.remove('active'));
      document.querySelectorAll(`[data-frag="${id}"]`).forEach(b => b.classList.add('active'));
      updateCharts(id);
    });
    svg.appendChild(path);
  });
  document.getElementById('minimap').appendChild(svg);
}

async function loadData() {
  const svcText = await (await fetch('./data/services_fragment_risk.csv')).text();
  svcText.trim().split('\n').slice(1).forEach(line => {
    const [svc, frag, null_, low, mod, high] = line.split(',');
    if (!SVC_DATA[svc]) SVC_DATA[svc] = {};
    SVC_DATA[svc][frag] = { null:+null_, low:+low, mod:+mod, high:+high };
  });

  const luText = await (await fetch('./data/landuse_fragment_risk.csv')).text();
  const lines = luText.trim().split('\n');
  const USES  = ['agricultural','commercial','industrial','institutional','mix_residential','open_space','residential','waterbody'];
  const LEVELS= ['00_null','01_high','02_moderate','03_low'];
  lines.slice(3,8).forEach(line => {
    const cols = line.split(',');
    const frag = 'F'+cols[0].trim();
    let col = 1;
    LEVELS.forEach(level => {
      USES.forEach(use => { LU_DATA.push({ frag, level, use, area:parseFloat(cols[col])||0 }); col++; });
      col++;
    });
  });

  await buildMinimap();
  updateCharts('all');
}

document.querySelectorAll("[data-frag]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-frag]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    updateCharts(btn.dataset.frag);
  });
});

loadData();
</script>
</body>
</html>
